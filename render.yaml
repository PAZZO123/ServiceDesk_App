# ============================================================
#  Render Blueprint: everything ServiceDesk needs, on the FREE plan.
#  Render dashboard -> New -> Blueprint -> pick this repo.
#
#  Free plan limits (render.com/docs/free), accepted for a demo:
#  - the web service sleeps after 15 min without visitors (~1 min to wake)
#  - Postgres is deleted 30 days after creation
#  - only ONE free Key Value per workspace: we share bizpilot-redis (see below);
#    it is memory only, so queued jobs are lost on restart
#  - no disk: uploaded files are lost on every deploy/restart
#  - no SMTP: email goes through Brevo's HTTPS API (BREVO_API_KEY)
#  All three services must be in the same region to talk privately.
# ============================================================

services:
  - type: web
    name: servicedesk
    runtime: docker
    plan: free
    region: frankfurt # closest Render region to Kigali
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true # every push to main redeploys
    envVars:
      - key: ENVIRONMENT
        value: production # hides /docs, strict CORS
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true # random, made once by Render, never in git
      - key: DATABASE_URL
        fromDatabase:
          name: servicedesk-db
          property: connectionString # config.py adds +asyncpg
      - key: DB_POOL_SIZE
        value: "5" # small instance, small pool
      - key: DB_MAX_OVERFLOW
        value: "5"
      # Redis: Render allows ONE free Key Value per workspace, and this one
      # already has bizpilot-redis (Frankfurt, used by bizpilot-api). We share
      # it instead of creating our own. A Blueprint may point at a service it
      # did not create, as long as it exists in the workspace.
      # ONE variable, KEYVALUE_URL: config.py builds the cache and Celery
      # URLs from it with database numbers 10 (cache), 11 (Celery queue) and
      # 12 (results), so our keys never mix with BizPilot's (database 0).
      # Do NOT add CELERY_BROKER_URL / CELERY_RESULT_BACKEND here: Celery
      # reads those variables itself and would skip the database number.
      - key: KEYVALUE_URL
        fromService:
          type: keyvalue
          name: bizpilot-redis
          property: connectionString
      - key: KEYVALUE_DB_BASE
        value: "10"
      # sync: false = Render asks YOU for the value when the Blueprint is
      # created. Secrets never go in this file.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false # the sender address you verified in Brevo
      - key: ADMIN_EMAIL
        sync: false # optional: your account, made admin on the next start
      - key: DEMO_PASSWORD
        sync: false # optional: creates the demo accounts with this password

databases:
  - name: servicedesk-db
    plan: free
    region: frankfurt
    databaseName: servicedesk
    user: servicedesk
