
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background:#f1f5f9;
             font-family:'Segoe UI',Arial,sans-serif; color:#0f172a;">

  <div style="max-width:560px; margin:0 auto; padding:32px 20px;">

    <div style="background:#ffffff; border-radius:10px; padding:32px;
                border:1px solid #e2e8f0;">

      <div style="font-size:20px; font-weight:700; color:#1f4e79;
                  margin-bottom:24px;">
        {{ app_name }}
      </div>

      {# The child template's content drops in here. #}
      {% block content %}{% endblock %}

    </div>

    <div style="text-align:center; font-size:12px; color:#64748b;
                margin-top:20px; line-height:1.6;">
      {% block footer %}
      This is an automated message from {{ app_name }}.<br>
      Please do not reply to this address.
      {% endblock %}
    </div>

  </div>
</body>
</html>
